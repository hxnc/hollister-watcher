name: Hollister restock check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a bit)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: restock-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Send test message
        if: ${{ inputs.test }}
        env:
          NOTIFY_SECRETS: ${{ secrets.NOTIFY_SECRETS }}
        run: python hollister_restock.py --test

      - name: Check Hollister
        if: ${{ !inputs.test }}
        env:
          NOTIFY_SECRETS: ${{ secrets.NOTIFY_SECRETS }}
        run: python hollister_restock.py --once

      - name: Save stock state
        if: ${{ !inputs.test }}
        run: |
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update stock state" && git push)
